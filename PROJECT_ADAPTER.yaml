# PROJECT_ADAPTER.yaml - Optional project-specific adapter

version: "statedd-template-v3"

project:
  name: subnetweb
  short_name: subnetweb
  description: "Subnet Master frontend-only subnetting learning and calculation website."

vocabulary:
  control_plane_name: "control plane"
  state_plane_name: "state plane"
  evidence_plane_name: "evidence plane"
  runtime_identity_name: "runtime identity"

runtime:
  frontend_port: 5173
  api_port: null
  public_url: http://127.0.0.1:5173
  execution_mode: bootstrap
  runtime_identity_surface: Vite dev server

commands:
  install: npm install
  dev: npm run dev
  dev_ngrok: npm run dev -- --host 0.0.0.0
  ngrok: ngrok http 5173
  build: npm run build
  preview: npm run preview
  test: npm test

integrations: []

notes:
  - "All subnet calculations run in the browser."
  - "No backend, database, or login exists."
  - "Keep PROJECT_DNA.yaml focused on invariants."
